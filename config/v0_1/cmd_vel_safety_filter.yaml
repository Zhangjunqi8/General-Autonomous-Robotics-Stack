cmd_vel_safety_filter:
  ros__parameters:
    scan_topic: /scan
    input_cmd_topic: /cmd_vel_smoothed
    recovery_cmd_topic: /cmd_vel_recovery
    output_cmd_topic: /cmd_vel
    safety_state_topic: /cmd_vel_safety_filter/state
    base_frame: base_footprint

    footprint:
      front: 0.24
      rear: 0.24
      left: 0.17
      right: 0.17

    emergency_clearance: 0.06
    prediction_time: 0.60
    simulation_dt: 0.08
    control_frequency: 30.0
    scan_timeout: 0.30
    cmd_timeout: 0.30
    recovery_cmd_timeout: 0.30
    stop_on_stale_scan: true
    scale_until_safe: true
    min_scale: 0.25

    max_vel_x: 0.25
    max_vel_y: 0.15
    max_vel_theta: 0.70
