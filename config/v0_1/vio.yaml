ros__parameters:
  left_image_topic: /hanmole/sensor/camera_head_left/image_raw
  right_image_topic: /hanmole/sensor/camera_head_right/image_raw
  imu_topic: /imu/data
  odom_topic: /vio/odom
  publish_nav_odom: true
  nav_odom_topic: /vio/odom_2d
  nav_frame_id: vio_odom
  nav_child_frame_id: base_footprint
  project_nav_odom_2d: false
  path_topic: /vio/path
  camera_pose_topic: /vio/camera_pose
  tracked_points_topic: /vio/tracked_points
  publish_tracked_points: false
  frame_id: vio_odom
  child_frame_id: base_link
  max_stereo_time_diff_sec: 0.025
  max_image_queue_size: 10
  max_imu_queue_size: 2000
  max_imu_window_sec: 0.25
  max_path_size: 2000
  publish_tf: false
  
