velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 30.0
    feedback: "OPEN_LOOP"
    scale_velocities: false
    enable_stamped_cmd_vel: false
    cmd_vel_in_topic: "/cmd_vel_raw"
    cmd_vel_out_topic: "/cmd_vel_smoothed"
    max_velocity: [0.25, 0.15, 0.70]
    min_velocity: [-0.25, -0.15, -0.70]
    max_accel: [0.20, 0.15, 0.60]
    max_decel: [-0.30, -0.20, -0.80]
    deadband_velocity: [0.002, 0.002, 0.02]
    velocity_timeout: 0.50
    odom_topic: "/odometry/filtered"
    odom_duration: 0.10
