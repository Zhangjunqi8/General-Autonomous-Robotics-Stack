# HanMole v0_1 Nav2 麦克纳姆导航基线配置
#
# 设计目标：
# 1. AMCL 按全向底盘建模，避免横移时定位模型退化为差速假设。
# 2. 全局规划按全向 / 非圆形底盘能力建模，使用 Smac Lattice + omni primitives。
# 3. 局部控制使用 MPPI Omni，显式保留横移、倒车与旋转能力。
# 4. 速度命令链路固定为 cmd_vel_nav -> cmd_vel_smoothed -> /cmd_vel。
# 5. footprint 直接使用 v0_1 底盘碰撞盒在 base_footprint 平面的投影。

amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.20
    alpha2: 0.20
    alpha3: 0.15
    alpha4: 0.15
    alpha5: 0.10
    robot_model_type: "nav2_amcl::OmniMotionModel"
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 3.0
    laser_max_range: 20.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 100
    max_particles: 3000
    min_particles: 800
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    scan_topic: "/scan"
    transform_tolerance: 0.5
    update_min_a: 0.03
    update_min_d: 0.03
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.45
    z_short: 0.05

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    enable_stamped_cmd_vel: True
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    publish_errors: True
    storage_id: "sqlite3"
    odom_topic: "/odometry/filtered"
    cmd_vel_out_topic: "cmd_vel_nav"
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 6.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # 麦克纳姆允许末端阶段横移靠近目标点，XY 可以比 yaw 更早收敛。
      stateful: true
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.20

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      iteration_count: 1
      prune_distance: 1.6
      transform_tolerance: 0.15
      temperature: 0.3
      gamma: 0.015
      motion_model: "Omni"
      visualize: false
      regenerate_noises: true
      publish_optimal_trajectory: false
      vx_std: 0.20
      vy_std: 0.14
      wz_std: 0.20
      vx_max: 0.45
      vx_min: -0.30
      vy_max: 0.28
      wz_max: 0.90
      ax_max: 0.90
      ax_min: -0.90
      ay_max: 0.70
      ay_min: -0.70
      az_max: 1.20
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      TrajectoryValidator:
        plugin: "mppi::DefaultOptimalTrajectoryValidator"
        collision_lookahead_time: 2.0
        consider_footprint: true
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "TwirlingCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.8
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.7
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.2
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        # 降低终点朝向过调，避免低速横移时原地抖动。
        cost_weight: 1.5
        threshold_to_consider: 0.30
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.07
        trajectory_point_step: 4
        threshold_to_consider: 0.35
        offset_from_furthest: 18
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        offset_from_furthest: 5
        threshold_to_consider: 1.2
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 0.8
        offset_from_furthest: 4
        threshold_to_consider: 0.30
        max_angle_to_furthest: 1.2
        mode: 0
      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerLattice"
      tolerance: 0.10
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 2000
      max_planning_time: 2.0
      lookup_table_size: 20.0
      minimum_turning_radius: 0.50
      reverse_penalty: 1.15
      rotation_penalty: 1.3
      change_penalty: 0.0
      non_straight_penalty: 1.05
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 5.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      lattice_filepath: "/opt/ros/jazzy/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/omni/output.json"
      cache_obstacle_heuristic: true
      allow_reverse_expansion: true
      allow_primitive_interpolation: true
      downsample_obstacle_heuristic: false
      smooth_path: true
      smoother:
        tolerance: 1.0e-10
        max_iterations: 1000
        w_data: 0.2
        w_smooth: 0.3
        do_refinement: True
        refinement_num: 2

behavior_server:
  ros__parameters:
    use_sim_time: False
    enable_stamped_cmd_vel: True
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait", "drive_on_heading", "assisted_teleop"]

    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"

    simulate_ahead_time: 0.2
    max_rotational_vel: 0.60
    min_rotational_vel: 0.10
    rotational_acc_lim: 1.00
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.5

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0
      max_its: 1000
      do_refinement: True

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 50.0
    feedback: "CLOSED_LOOP"
    scale_velocities: False
    enable_stamped_cmd_vel: True
    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "cmd_vel_smoothed"
    max_velocity: [0.45, 0.28, 0.90]
    min_velocity: [-0.30, -0.28, -0.90]
    max_accel: [0.90, 0.70, 1.20]
    max_decel: [-0.90, -0.70, -1.20]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.002, 0.002, 0.02]
    velocity_timeout: 0.20

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

route_server:
  ros__parameters:
    use_sim_time: False

collision_monitor:
  ros__parameters:
    use_sim_time: False
    enable_stamped_cmd_vel: True
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.30
    source_timeout: 0.20
    base_shift_correction: true
    stop_pub_timeout: 0.10

    polygons: ["VelocityStop", "FootprintApproach"]

    VelocityStop:
      type: "velocity_polygon"
      action_type: "stop"
      min_points: 8
      visualize: true
      polygon_pub_topic: "velocity_polygon_stop"
      enabled: true
      holonomic: true
      velocity_polygons: [
        "rotation",
        "translation_forward",
        "translation_left",
        "translation_backward_left",
        "translation_backward_right",
        "translation_right",
        "stopped"]
      rotation:
        points: "[[0.28, 0.22], [0.28, -0.22], [-0.28, -0.22], [-0.28, 0.22]]"
        linear_min: 0.0
        linear_max: 0.05
        theta_min: -1.0
        theta_max: 1.0
      translation_forward:
        points: "[[0.40, 0.20], [0.40, -0.20], [-0.22, -0.20], [-0.22, 0.20]]"
        linear_min: 0.05
        linear_max: 0.60
        theta_min: -1.0
        theta_max: 1.0
        direction_start_angle: -0.785398
        direction_end_angle: 0.785398
      translation_left:
        points: "[[0.24, 0.30], [0.24, -0.18], [-0.24, -0.18], [-0.24, 0.30]]"
        linear_min: 0.05
        linear_max: 0.60
        theta_min: -1.0
        theta_max: 1.0
        direction_start_angle: 0.785398
        direction_end_angle: 2.356194
      translation_backward_left:
        points: "[[0.22, 0.20], [0.22, -0.20], [-0.40, -0.20], [-0.40, 0.20]]"
        linear_min: 0.05
        linear_max: 0.60
        theta_min: -1.0
        theta_max: 1.0
        direction_start_angle: 2.356194
        direction_end_angle: 3.141593
      translation_backward_right:
        points: "[[0.22, 0.20], [0.22, -0.20], [-0.40, -0.20], [-0.40, 0.20]]"
        linear_min: 0.05
        linear_max: 0.60
        theta_min: -1.0
        theta_max: 1.0
        direction_start_angle: -3.141593
        direction_end_angle: -2.356194
      translation_right:
        points: "[[0.24, 0.18], [0.24, -0.30], [-0.24, -0.30], [-0.24, 0.18]]"
        linear_min: 0.05
        linear_max: 0.60
        theta_min: -1.0
        theta_max: 1.0
        direction_start_angle: -2.356194
        direction_end_angle: -0.785398
      stopped:
        points: "[[0.30, 0.22], [0.30, -0.22], [-0.30, -0.22], [-0.30, 0.22]]"
        linear_min: 0.0
        linear_max: 1.0
        theta_min: -1.0
        theta_max: 1.0

    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 0.50
      simulation_time_step: 0.05
      min_points: 8
      visualize: false
      enabled: true

    observation_sources: ["scan"]

    scan:
      source_timeout: 0.20
      type: "scan"
      topic: "/scan"
      enabled: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 2.0
      publish_frequency: 2.0
      always_send_full_costmap: True
      global_frame: map
      robot_base_frame: base_footprint
      # 直接使用 v0_1 base_link 碰撞盒在 base_footprint 平面的投影。
      footprint: "[[0.21, 0.15], [0.21, -0.15], [-0.21, -0.15], [-0.21, 0.15]]"
      footprint_padding: 0.01
      resolution: 0.05
      track_unknown_space: false
      transform_tolerance: 0.30
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: True
          observation_persistence: 0.3
          obstacle_min_range: 0.0
          obstacle_max_range: 3.5
          raytrace_min_range: 0.0
          raytrace_max_range: 4.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.60

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 15.0
      publish_frequency: 8.0
      always_send_full_costmap: True
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4.5
      height: 4.5
      resolution: 0.05
      footprint: "[[0.21, 0.15], [0.21, -0.15], [-0.21, -0.15], [-0.21, 0.15]]"
      footprint_padding: 0.01
      transform_tolerance: 0.15
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: True
          observation_persistence: 0.2
          obstacle_min_range: 0.0
          obstacle_max_range: 3.0
          raytrace_min_range: 0.0
          raytrace_max_range: 4.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.60
