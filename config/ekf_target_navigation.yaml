    nav_status_topic: "/nav_status"
    nav_feedback_topic: "/hanmole/agv/nav_feedback"
    target_state_topic: "/hanmole_navigation/target_state"
    dock_state_topic: "/hanmole_navigation/dock_state"
    initial_pose_topic: "/initialpose"
    action_timeout_ms: 3000
    dock_motion_timeout_ms: 120000
    goal_xy_tolerance: 0.05
    goal_yaw_tolerance: 0.03
    dock_staging_target: "DOCK_STAGING"
    dock_charge_target: "DOCK_CHARGE"
    docking_controller_id: "DockMppi"
    docking_goal_checker_id: "dock_goal_checker"
    undock_goal_checker_id: "general_goal_checker"
    docking_progress_checker_id: "dock_progress_checker"

