    target_file: "/tmp/hanmole_navigation/target_map.yaml"
    target_group: "default"
    nav_mode: "ekf_odom"
    amcl_pose_topic: "/amcl_pose"
    scan_topic: "/scan"
    filtered_odom_topic: "/odometry/filtered"
    raw_odom_topic: "/odom"
    odom_topic: ""
    map_topic: "/map"
    robot_base_frame: "base_footprint"
