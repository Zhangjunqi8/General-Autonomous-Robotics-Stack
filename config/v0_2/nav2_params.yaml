# Minimal Hanmole v0_2 Nav2 profile.
# The four-steer-four-drive controller should expose the same external base
# contract as a standard mobile-base controller: /cmd_vel, /odom and /tf.
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    enable_stamped_cmd_vel: true
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "Omni"
      vx_max: 0.6
      vx_min: -0.35
      vy_max: 0.45
      wz_max: 1.2
      ax_max: 1.2
      ax_min: -1.2
      ay_max: 1.2
      ay_min: -1.2
      az_max: 1.5

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    feedback: "OPEN_LOOP"
    max_velocity: [0.6, 0.45, 1.2]
    min_velocity: [-0.35, -0.45, -1.2]
    max_accel: [1.2, 1.2, 1.5]
    max_decel: [-1.2, -1.2, -1.5]
    odom_topic: "/odom"
    velocity_timeout: 1.0
