controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    base_controller:
      type: hanmole_controllers/SwerveDriverController

base_controller:
  ros__parameters:
    cmd_vel_topic: /cmd_vel
    odom_topic: /odom
    odom_frame_id: odom
    base_frame_id: base_footprint
    publish_rate: 50.0
    enable_odom_tf: false

    wheel_radius: 0.07
    wheel_base: 0.488
    track_width: 0.3727
    max_wheel_velocity: 8.0
    max_steer_velocity: 5.0
    steer_angle_tolerance: 0.02
    drive_alignment_deadzone: 0.12
    spin_drive_alignment_deadzone: 0.20
    # 当前主控制链实际以 hanmole_hardware/configs/v0_2/ros2_controllers.yaml 为准。
    # 这里同步 v0_2 模型的左右非对称转向角域，并开启防缠线 steer 限位策略。
    enable_steer_position_limits: true
    # 该组限位按 controller / hardware 实际坐标系填写，已包含 steer_signs 的镜像。
    steer_position_lower_limits: [-1.67, 0.0, 0.0, -1.67]
    steer_position_upper_limits: [0.0, 1.67, 1.67, 0.0]
    steer_soft_limit_margin: 0.12
    enable_steer_flip: true
    steer_flip_on_threshold: 2.10
    steer_flip_off_threshold: 1.30
    steer_flip_min_interval: 0.80
    zero_wheel_velocity_when_steer_target_clamped: true
    command_timeout: 0.5
    stop_command_epsilon: 0.001
    odom_linear_deadband: 0.005
    odom_angular_deadband: 0.005
    park_on_stop_command: false

    steer_joints:
      - joint_steer_front_left
      - joint_steer_front_right
      - joint_steer_rear_left
      - joint_steer_rear_right
    wheel_joints:
      - joint_wheel_front_left
      - joint_wheel_front_right
      - joint_wheel_rear_left
      - joint_wheel_rear_right

    pose_covariance_diagonal: [0.02, 0.02, 0.0, 0.0, 0.0, 0.05]
    twist_covariance_diagonal: [0.02, 0.02, 0.0, 0.0, 0.0, 0.05]
